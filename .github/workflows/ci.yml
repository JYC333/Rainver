name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build protocol
        run: pnpm --filter @rainver/protocol build

      # The command a dispatched agent calls Rainver back with. Built as well
      # as tested: the server stages the built entry, so a green run that only
      # ever exercised the TypeScript source would not have covered what
      # production actually copies.
      - name: Build agent CLI
        run: pnpm --filter @rainver/agent-cli build

      - name: Typecheck agent CLI
        run: pnpm --filter @rainver/agent-cli typecheck

      - name: Test agent CLI
        run: pnpm --filter @rainver/agent-cli test

      - name: Build folder-read
        run: pnpm --filter @rainver/folder-read build

      - name: Typecheck folder-read
        run: pnpm --filter @rainver/folder-read typecheck

      - name: Test folder-read
        run: pnpm --filter @rainver/folder-read test

      - name: Test deployer boundary
        run: python3 -m unittest discover -s deployer -p 'test_*.py'

      - name: Test backup archive safety
        run: python3 -m unittest discover -s ops/scripts/system -p 'test_*.py'

      - name: Typecheck server
        run: pnpm --filter @rainver/server typecheck
      # The only guard that the migration baseline still matches the schema
      # source. `baselineSchema.test.ts` proves the migration applies; it does
      # not prove it is what `src/db/schema/` generates. A schema edit shipped
      # without regenerating passes every other step here.
      - name: Server schema baseline is in sync
        run: pnpm --filter @rainver/server schema:check

      - name: Test server
        env:
          REQUIRE_TEST_POSTGRES: "true"
          TESTCONTAINERS_REUSE_ENABLE: "false"
        run: pnpm --filter @rainver/server test

      - name: Typecheck web
        run: pnpm --filter @rainver/web typecheck

      - name: Test web
        run: pnpm --filter @rainver/web test

  # Production deploys pull these images instead of building on the host, so
  # the artifact that reaches a prod machine is the one this run verified.
  # dev → edge, master → stable, every push → an immutable sha-<commit> tag.
  # Pushing with GITHUB_TOKEN links each GHCR package to this repository, so
  # it inherits the repository's visibility (public here) without manual setup.
  publish-images:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: .
            dockerfile: server/Dockerfile
            target: runtime
          - name: frontend
            context: .
            dockerfile: apps/web/Dockerfile
            target: prod
          - name: sandbox-runner
            context: .
            dockerfile: sandbox/Dockerfile
            target: ""
          - name: deployer
            context: deployer
            dockerfile: deployer/Dockerfile
            target: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An update carries the four images and nothing else: the deployer's own
      # image and the ops/ tree its stages run from move by a host command
      # (ADR 0020 §6). Every image is stamped with a content digest of exactly
      # those paths, so an instance can tell "the deployer is a commit behind"
      # — true after every update, and harmless — from "the deployment surface
      # actually changed", which is the only case that needs the host step.
      # `git ls-files -s` reads the index, so a shallow checkout is enough.
      - name: Resolve the deployment surface
        id: surface
        shell: bash
        run: echo "value=$(git ls-files -s deployer ops | git hash-object --stdin | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # GHCR image names must be lowercase; the repository owner is not.
      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rainver-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=stable,enable=${{ github.ref_name == 'master' }}
            type=raw,value=edge,enable=${{ github.ref_name == 'dev' }}
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.rainver.deployment-surface=${{ steps.surface.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RAINVER_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
