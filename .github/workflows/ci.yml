name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build protocol
        run: pnpm --filter @rainver/protocol build

      - name: Test deployer boundary
        run: python3 -m unittest discover -s deployer -p 'test_*.py'

      - name: Test backup archive safety
        run: python3 -m unittest discover -s ops/scripts/system -p 'test_*.py'

      - name: Typecheck server
        run: pnpm --filter @rainver/server typecheck

      - name: Test server
        env:
          REQUIRE_TEST_POSTGRES: "true"
          TESTCONTAINERS_REUSE_ENABLE: "false"
        run: pnpm --filter @rainver/server test

      - name: Typecheck web
        run: pnpm --filter @rainver/web typecheck

      - name: Test web
        run: pnpm --filter @rainver/web test
