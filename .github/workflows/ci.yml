name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build protocol
        run: pnpm --filter @rainver/protocol build

      # The command a dispatched agent calls Rainver back with. Built as well
      # as tested: the server stages the built entry, so a green run that only
      # ever exercised the TypeScript source would not have covered what
      # production actually copies.
      - name: Build agent CLI
        run: pnpm --filter @rainver/agent-cli build

      - name: Typecheck agent CLI
        run: pnpm --filter @rainver/agent-cli typecheck

      - name: Test agent CLI
        run: pnpm --filter @rainver/agent-cli test

      - name: Build folder-read
        run: pnpm --filter @rainver/folder-read build

      - name: Typecheck folder-read
        run: pnpm --filter @rainver/folder-read typecheck

      - name: Test folder-read
        run: pnpm --filter @rainver/folder-read test

      - name: Test deployer boundary
        run: python3 -m unittest discover -s deployer -p 'test_*.py'

      - name: Test backup archive safety
        run: python3 -m unittest discover -s ops/scripts/system -p 'test_*.py'

      - name: Typecheck server
        run: pnpm --filter @rainver/server typecheck
      # The only guard that the migration baseline still matches the schema
      # source. `baselineSchema.test.ts` proves the migration applies; it does
      # not prove it is what `src/db/schema/` generates. A schema edit shipped
      # without regenerating passes every other step here.
      - name: Server schema baseline is in sync
        run: pnpm --filter @rainver/server schema:check

      - name: Test server
        env:
          REQUIRE_TEST_POSTGRES: "true"
          TESTCONTAINERS_REUSE_ENABLE: "false"
        run: pnpm --filter @rainver/server test

      - name: Typecheck web
        run: pnpm --filter @rainver/web typecheck

      - name: Test web
        run: pnpm --filter @rainver/web test
