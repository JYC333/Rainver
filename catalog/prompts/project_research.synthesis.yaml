asset_key: project_research.synthesis
display_name: Project Research Synthesis Prompt
description: >
  Registry-managed synthesis prompt for any non-empty approved Project Research
  corpus. Empty-corpus result semantics are resolved before model invocation.
content:
  schema_version: prompt_asset.v1
  prompt_type: workflow
  template: |-
    Project: {project_id}
    Research question: {research_question}
    Research scope (in/out/sub-questions): {research_scope}
    Report depth: {report_depth}
    Critique to address: {critique_context}
    Use only the approved project corpus and its evidence. Do not invent citations.
    Treat scope.in as the reporting boundary, exclude scope.out, and answer the listed
    sub-questions where the approved evidence permits; identify unsupported sub-questions
    as gaps instead of broadening the report.
    Return exactly one JSON object with status and artifacts. Do not return Markdown, XML/reasoning tags, or prose outside the JSON object.
    The approved corpus supplied to this task is non-empty. Always use status="succeeded" and include exactly one artifact. A small, partial, indirect, or conflicting corpus is not an error: synthesize only what it supports, state evidence strength, record unanswered aspects as research gaps, and describe coverage limits explicitly.
    The required success artifact is research_report.archive.v1. It must contain title, artifact_type, mime_type, and content. Content must be one JSON object, never Markdown, a code fence, prose, or a JSON-encoded string.
    The content object must contain schema_version="research_report.v1", research_question, summary, findings (claim, support, references), sources (title, authors, year, relevance, summary, references), limitations, and ideas (title, problem, novelty, testability, references).
    Every finding, source row, and idea must include source_item_id/evidence_id/object_id/doi/arxiv_id references.
    Reference ids must be copied verbatim from the corpus context as complete identifiers; never shorten, truncate, or reformat an id.
    Disclose material evidence on both sides of a contradiction. In each finding's support, state the evidence strength as abstract-only, full-text, or multi-source. Record the retrieval strategy and evidence coverage window in limitations.
    For report_depth="quick", keep the summary concise, emit at most five findings, and allow ideas to be empty. For report_depth="full", produce the complete defensible synthesis.
    When critique_context is not "none", revise the report to address every listed issue without inventing new evidence.

    Valid successful JSON example (copy this complete structure, replace the example values,
    and copy every reference identifier verbatim from the supplied corpus):
    {
      "status": "succeeded",
      "artifacts": [
        {
          "title": "Tool-call failure recovery in coding agents",
          "artifact_type": "research_report.archive.v1",
          "mime_type": "application/json",
          "content": {
            "schema_version": "research_report.v1",
            "research_question": "How do tool-using coding agents recover from failed tool calls?",
            "summary": "The approved evidence indicates that explicit state inspection and bounded retry policies can improve recovery, although coverage is limited to the evaluated benchmarks.",
            "findings": [
              {
                "claim": "State-aware retry strategies improve recovery in the evaluated coding-agent setting.",
                "support": "Full-text evidence from one approved source reports higher task recovery after the agent inspects failure state before retrying.",
                "references": [
                  {"source_item_id": "source-item-id-from-corpus"},
                  {"evidence_id": "evidence-id-from-corpus"}
                ]
              }
            ],
            "limitations": [
              "The approved corpus covers a limited set of coding-agent benchmarks.",
              "The retrieval window and provider coverage may omit relevant unpublished evaluations."
            ],
            "sources": [
              {
                "title": "Example material title copied from the corpus",
                "authors": ["Example Author"],
                "year": 2025,
                "references": [
                  {"source_item_id": "source-item-id-from-corpus"}
                ],
                "relevance": "relevant",
                "summary": "This source directly evaluates recovery after injected tool-call failures."
              }
            ],
            "ideas": [
              {
                "title": "Cross-benchmark recovery evaluation",
                "problem": "Existing evidence may not generalize beyond the evaluated benchmark.",
                "novelty": "Compare the same recovery policies across several agent environments under controlled failures.",
                "testability": "Measure recovery rate, task completion, and additional tool cost under a preregistered failure protocol.",
                "references": [
                  {"source_item_id": "source-item-id-from-corpus"}
                ]
              }
            ]
          }
        }
      ]
    }
  variables_schema:
    type: object
    required:
      - project_id
      - research_question
      - research_scope
      - report_depth
      - critique_context
    properties:
      project_id:
        type: string
      research_question:
        type: string
      research_scope:
        type: string
      report_depth:
        type: string
      critique_context:
        type: string
  output_schema: {}
  model_config: {}
  rendering:
    engine: plain
  safety:
    untrusted_data_delimiters: false
    requires_proposal_for_promotion: true
