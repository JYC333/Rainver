services:
  postgres:
    container_name: agent-space-test-postgres
    image: pgvector/pgvector:pg${POSTGRES_MAJOR:-18}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-agent_space}
      - POSTGRES_USER=${POSTGRES_USER:-agent_space}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agent_space_dev_password}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ${AGENT_SPACE_MODE_ROOT:-$HOME/.aspace/test}/db/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_space} -d ${POSTGRES_DB:-agent_space}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Official server (test stack). The frontend reaches it through the compose network.
  server:
    build:
      context: ../../
      dockerfile: server/Dockerfile
      target: dev-runtime
      network: host
    container_name: agent-space-test-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../server/src:/app/server/src:ro
      - ../../server/scripts:/app/server/scripts:ro
      - ../../server/migrations:/app/server/migrations:ro
      - ../../server/tsconfig.json:/app/server/tsconfig.json:ro
      - ../../packages/protocol/src:/app/packages/protocol/src:ro
      - ../../plugins:/app/plugins:ro
      - ${AGENT_SPACE_MODE_ROOT:-$HOME/.aspace/test}:/aspace
    env_file:
      - ${AGENT_SPACE_MODE_ROOT:-$HOME/.aspace/test}/.server.env
    environment:
      - AGENT_SPACE_HOME=/aspace
      - AGENT_SPACE_ENV=test
      - BACKUP_DATABASE_URL=${BACKUP_DATABASE_URL:-postgresql://${POSTGRES_USER:-agent_space}:${POSTGRES_PASSWORD:-agent_space_dev_password}@postgres:5432/${POSTGRES_DB:-agent_space}}
      - SANDBOX_RUNNER_HOST=sandbox-runner
      - SANDBOX_RUNNER_SERVER_HOST=server
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-runner:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8010/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3
    command: >
      sh -c "node scripts/watch-typescript.mjs &
             node --watch dist/index.js"
    restart: unless-stopped
    networks:
      - default
      - runner-control

  sandbox-runner:
    build:
      context: ../../
      dockerfile: sandbox/Dockerfile
      network: host
    security_opt:
      - seccomp=unconfined
      - no-new-privileges=true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /run:rw,noexec,nosuid,size=16m
    env_file:
      - path: ${AGENT_SPACE_MODE_ROOT:-$HOME/.aspace/test}/.runner.env
        required: false
    volumes:
      - ${AGENT_SPACE_MODE_ROOT:-$HOME/.aspace/test}/workspaces:/runner/workspaces
      - ${AGENT_SPACE_MODE_ROOT:-$HOME/.aspace/test}/sandboxes:/runner/sandboxes
      - ${AGENT_SPACE_MODE_ROOT:-$HOME/.aspace/test}/runtime-tools:/runner/runtime-tools:ro
      - ${AGENT_SPACE_MODE_ROOT:-$HOME/.aspace/test}/cache/runtime-homes:/runner/run-homes
      - ${AGENT_SPACE_MODE_ROOT:-$HOME/.aspace/test}/cache/conversation-runtime-homes:/runner/conversation-homes
      - ${AGENT_SPACE_MODE_ROOT:-$HOME/.aspace/test}/cache/login-homes:/runner/login-homes
    environment:
      - SANDBOX_RUNNER_PORT=8020
    networks:
      - runner-control
    restart: unless-stopped

  frontend:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
      network: host
      target: dev
    ports:
      - "3100:5173"
    volumes:
      - ../../package.json:/repo/package.json:ro
      - ../../pnpm-workspace.yaml:/repo/pnpm-workspace.yaml:ro
      - ../../pnpm-lock.yaml:/repo/pnpm-lock.yaml:ro
      - ../../packages/protocol/package.json:/repo/packages/protocol/package.json:ro
      - ../../server/package.json:/repo/server/package.json:ro
      - ../../apps/web:/repo/apps/web
      - ../../plugins:/repo/plugins:ro
      - /repo/apps/web/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      server:
        condition: service_healthy

  deployer:
    build:
      context: ../../deployer
      dockerfile: Dockerfile
      network: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../:/repo:rw
      - ${AGENT_SPACE_MODE_ROOT:-$HOME/.aspace/test}:/aspace
    user: "1000:989"
    environment:
      - DEPLOYER_SOCKET=/tmp/agent-space-deployer.sock
      - REPO_ROOT=/repo
      - AGENT_SPACE_HOME=/aspace
      - AGENT_SPACE_ENV=test
    restart: unless-stopped

networks:
  runner-control:
    internal: true
