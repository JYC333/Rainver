services:
  postgres:
    container_name: rainver-prod-postgres
    image: pgvector/pgvector:pg${POSTGRES_MAJOR:-18}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-rainver}
      - POSTGRES_USER=${POSTGRES_USER:-rainver}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}/db/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rainver} -d ${POSTGRES_DB:-rainver}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Production runs the images CI publishes to GHCR (.github/workflows/ci.yml)
  # instead of building on this machine. RAINVER_IMAGE_TAG in the mode .env
  # selects the channel: stable (default, master), edge (dev), or an immutable
  # sha-<commit> for a pinned rollback. All four images move together.
  #
  # Official server — the default production API entrypoint. nginx
  # proxies /api to this service (see apps/web/nginx.conf). The API itself is
  # not published — nginx (:80) is the public face; the provider proxy below is
  # published to loopback so a paired execution host can be pointed at it. Production migrations and
  # official plugin server artifacts are bundled in the server image; do not
  # bind-mount live migration or plugin source files.
  server:
    image: ghcr.io/jyc333/rainver-server:${RAINVER_IMAGE_TAG:-stable}
    container_name: rainver-prod-server
    volumes:
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}:/rainver
    env_file:
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}/.server.env
    environment:
      - RAINVER_HOME=/rainver
      - RAINVER_ENV=prod
      - BACKUP_DATABASE_URL=${BACKUP_DATABASE_URL:-postgresql://${POSTGRES_USER:-rainver}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}@postgres:5432/${POSTGRES_DB:-rainver}}
      - SANDBOX_RUNNER_HOST=sandbox-runner
      - SANDBOX_RUNNER_SERVER_HOST=server
      # Binding a paired execution host to a ModelProvider needs the provider
      # proxy reachable from that machine, which needs a port that survives a
      # restart. Fixed here so the published mapping below is stable; the
      # in-network sandbox path is unaffected either way.
      - PROVIDER_PROXY_PORT=${PROVIDER_PROXY_PORT:-28421}
      # PROVIDER_PROXY_EXTERNAL_BASE_URL is deliberately NOT set here: an
      # `environment:` entry overrides `env_file`, so declaring it would
      # silently blank out the generated `.server.env` value. Set it in the
      # instance `.env`, which is what `.server.env` is generated from.
      # Unset means remote binding is unavailable, and dispatch says so rather
      # than handing a host a URL it cannot resolve.
    ports:
      # Loopback by default: reachable from this machine only. Widening this
      # bind is the deliberate step that exposes lease traffic to the local
      # network, and it is plaintext until a TLS entry exists.
      - "${PROVIDER_PROXY_BIND:-127.0.0.1}:${PROVIDER_PROXY_PORT:-28421}:${PROVIDER_PROXY_PORT:-28421}"
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-runner:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8010/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - default
      - runner-control

  sandbox-runner:
    image: ghcr.io/jyc333/rainver-sandbox-runner:${RAINVER_IMAGE_TAG:-stable}
    security_opt:
      - seccomp=unconfined
      - no-new-privileges=true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /run:rw,noexec,nosuid,size=16m
    env_file:
      - path: ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}/.runner.env
        required: false
    volumes:
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}/workspaces:/runner/workspaces
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}/sandboxes:/runner/sandboxes
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}/runtime-tools:/runner/runtime-tools:ro
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}/cache/runtime-homes:/runner/run-homes
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}/cache/conversation-runtime-homes:/runner/conversation-homes
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}/cache/login-homes:/runner/login-homes
    environment:
      - SANDBOX_RUNNER_PORT=8020
    networks:
      - runner-control
    restart: unless-stopped

  frontend:
    image: ghcr.io/jyc333/rainver-frontend:${RAINVER_IMAGE_TAG:-stable}
    # nginx serves the built static bundle and proxies /api to the server
    # service (see apps/web/nginx.conf).
    ports:
      # Loopback by default so a production instance in WSL is local-only
      # unless the operator deliberately exposes it to the LAN or a reverse proxy.
      - "${RAINVER_WEB_BIND:-127.0.0.1}:${RAINVER_WEB_PORT:-28400}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  deployer:
    image: ghcr.io/jyc333/rainver-deployer:${RAINVER_IMAGE_TAG:-stable}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # ADR 0020 §6: the update needs the compose files and ops/scripts, nothing
      # else. The checkout is no longer writable from this container.
      - ../../ops:/repo/ops:ro
      # Mounted at its host path on purpose. `docker compose` reads env_file and
      # build context client-side while the daemon resolves volume sources on the
      # host, so the two only agree when this container sees the mode root under
      # the same absolute path the host uses.
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}:${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}
    user: "1000:989"
    environment:
      - DEPLOYER_SOCKET=/tmp/rainver-deployer.sock
      - REPO_ROOT=/repo
      - RAINVER_ROOT=${RAINVER_ROOT:-$HOME/.rainver-data}
      - RAINVER_HOME=${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}
      # The host path this container must hand to Compose for volume sources.
      - RAINVER_HOST_MODE_ROOT=${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}
      # B43: the deployer never edits deployment inputs.
      - RAINVER_ENV_FILE_READONLY=1
      - RAINVER_ENV=prod
    env_file:
      # Generated by start.sh; absent until an instance has been provisioned, and
      # the poll loop refuses to start without the token rather than silently
      # polling unauthenticated.
      - path: ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/prod}/.deployer.env
        required: false
    restart: unless-stopped

networks:
  runner-control:
    internal: true
