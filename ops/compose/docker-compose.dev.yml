services:
  postgres:
    container_name: rainver-dev-postgres
    image: pgvector/pgvector:pg${POSTGRES_MAJOR:-18}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-rainver}
      - POSTGRES_USER=${POSTGRES_USER:-rainver}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rainver_dev_password}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/dev}/db/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rainver} -d ${POSTGRES_DB:-rainver}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Official server — the client-facing API entrypoint inside the compose network.
  server:
    build:
      context: ../../
      dockerfile: server/Dockerfile
      target: dev-runtime
      network: host
    container_name: rainver-dev-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../server/src:/app/server/src:ro
      - ../../server/scripts:/app/server/scripts:ro
      - ../../server/migrations:/app/server/migrations:ro
      - ../../server/tsconfig.json:/app/server/tsconfig.json:ro
      - ../../packages/protocol/src:/app/packages/protocol/src:ro
      - ../../packages/folder-read/src:/app/packages/folder-read/src:ro
      - ../../packages/outbound-guard/src:/app/packages/outbound-guard/src:ro
      - ../../plugins:/app/plugins:ro
      # Prompt/catalog edits must reach the boot-time builtin sync without an
      # image rebuild; a server restart is enough with the mount in place.
      - ../../catalog:/app/catalog:ro
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/dev}:/rainver
    env_file:
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/dev}/.server.env
    environment:
      - RAINVER_HOME=/rainver
      - RAINVER_ENV=dev
      - BACKUP_DATABASE_URL=${BACKUP_DATABASE_URL:-postgresql://${POSTGRES_USER:-rainver}:${POSTGRES_PASSWORD:-rainver_dev_password}@postgres:5432/${POSTGRES_DB:-rainver}}
      - SANDBOX_RUNNER_SERVER_HOST=server
      # The only peer whose X-Forwarded-* the server believes (the Vite proxy).
      - SERVER_TRUSTED_PROXY_HOST=frontend
      # Binding a paired execution host to a ModelProvider needs the provider
      # proxy reachable from that machine. Fixed here so the published mapping
      # below is stable; PROVIDER_PROXY_EXTERNAL_BASE_URL is deliberately not
      # declared, because an `environment:` entry would override `.server.env`
      # — set it in the instance `.env`, which `.server.env` is generated from
      # (e.g. http://<this-machine>:8021), when paired hosts should reach the
      # proxy somewhere other than FRONTEND_URL's host. Unset, a paired host
      # gets one derived from an http: FRONTEND_URL plus this port.
      - PROVIDER_PROXY_LISTEN_HOST=0.0.0.0
      - PROVIDER_PROXY_PORT=${PROVIDER_PROXY_PORT:-8021}
    ports:
      # Loopback by default, like prod. A daemon on another machine needs
      # PROVIDER_PROXY_BIND=0.0.0.0 — that is the deliberate step that puts
      # lease traffic on the local network, and it is plaintext until TLS.
      - "${PROVIDER_PROXY_BIND:-127.0.0.1}:${PROVIDER_PROXY_PORT:-8021}:${PROVIDER_PROXY_PORT:-8021}"
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-runner:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8010/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3
    command: >
      sh -c "node scripts/watch-typescript.mjs &
             node --watch dist/index.js"
    restart: unless-stopped
    networks:
      - default
      - runner-control

  sandbox-runner:
    build:
      context: ../../
      dockerfile: sandbox/Dockerfile
      network: host
    security_opt:
      - seccomp=unconfined
      - no-new-privileges=true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /run:rw,noexec,nosuid,size=16m
    volumes:
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/dev}/workspaces:/runner/workspaces
      # The built-in execution host: the registration credential the server
      # publishes (read-only — the control plane owns it), and everything the
      # daemon itself owns (managed copies, Agent runtime profiles, managed
      # workspaces, per-Run directories).
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/dev}/cache/builtin-host:/runner/builtin-host:ro
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/dev}/cache/host-daemon:/runner/host
    networks:
      # `runner-control` is internal and has no gateway. The built-in execution
      # host has to reach the outside world for the things a host does on its
      # own behalf — download a managed copy of a runtime, complete a vendor
      # login, reach a model provider — so it also joins a plain bridge network
      # that nothing else is attached to. That is egress, not reachability: no
      # other service is on it, so this container still cannot see the database
      # or any sibling, and nothing can dial into it.
      - runner-control
      - host-egress
    restart: unless-stopped

  frontend:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
      network: host
      target: dev
    ports:
      - "3000:5173"
    volumes:
      - ../../package.json:/repo/package.json:ro
      - ../../pnpm-workspace.yaml:/repo/pnpm-workspace.yaml:ro
      - ../../pnpm-lock.yaml:/repo/pnpm-lock.yaml:ro
      - ../../packages/protocol/package.json:/repo/packages/protocol/package.json:ro
      - ../../server/package.json:/repo/server/package.json:ro
      - ../../apps/web:/repo/apps/web
      - ../../plugins:/repo/plugins:ro
      - /repo/apps/web/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  deployer:
    build:
      context: ../../deployer
      dockerfile: Dockerfile
      network: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # ADR 0020 §6: the update needs the compose files and ops/scripts, nothing
      # else. The checkout is no longer writable from this container.
      - ../../ops:/repo/ops:ro
      # Mounted at its host path on purpose. `docker compose` reads env_file and
      # build context client-side while the daemon resolves volume sources on the
      # host, so the two only agree when this container sees the mode root under
      # the same absolute path the host uses.
      - ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/dev}:${RAINVER_MODE_ROOT:-$HOME/.rainver-data/dev}
    user: "1000:989"
    environment:
      - DEPLOYER_SOCKET=/tmp/rainver-deployer.sock
      - REPO_ROOT=/repo
      - RAINVER_ROOT=${RAINVER_ROOT:-$HOME/.rainver-data}
      - RAINVER_HOME=${RAINVER_MODE_ROOT:-$HOME/.rainver-data/dev}
      # The host path this container must hand to Compose for volume sources.
      - RAINVER_HOST_MODE_ROOT=${RAINVER_MODE_ROOT:-$HOME/.rainver-data/dev}
      # B43: the deployer never edits deployment inputs.
      - RAINVER_ENV_FILE_READONLY=1
      - RAINVER_ENV=dev
    env_file:
      # Generated by start.sh; absent until an instance has been provisioned, and
      # the poll loop refuses to start without the token rather than silently
      # polling unauthenticated.
      - path: ${RAINVER_MODE_ROOT:-$HOME/.rainver-data/dev}/.deployer.env
        required: false
    restart: unless-stopped

networks:
  runner-control:
    internal: true
  # Outbound only, and only for the built-in execution host. Narrowing what a
  # Run may reach through it is the daemon-owned egress proxy's job.
  host-egress:
