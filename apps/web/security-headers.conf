# Browser security headers, defined once and `include`d by every location.
#
# nginx *replaces* rather than inherits the `add_header` set as soon as a
# location adds one of its own, so each location that sets a cache header has
# to repeat this whole set. Five hand-maintained copies is how one of them came
# to disagree with the others; this file is the single copy.
#
# `img-src` allows `https:`, and that is a deliberate step back from what this
# phase first shipped.
#
# The Library reader renders captured articles with their own remote images
# (`image_policy: "remote_reference"`) — the article the person chose to read,
# not a URL a model picked. Tightening `img-src` to `'self'` broke every one of
# them, and only in production, since dev serves no headers at all: the same
# split the theme script was moved out of `index.html` to close.
#
# So the *renderer* is the boundary, not this header. Chat markdown and every
# model-authored document render a cross-origin image as a link and never fetch
# it (D5, `safeMarkdown.tsx` and `ReadOnlyTiptapReader`'s `remoteImages`, which
# is off unless a caller opts in). This header can no longer be the second layer
# for images while one surface legitimately needs third-party ones; a trusted
# image-host allowlist is the way to get it back, which O3 defers until there is
# a real need. `http:` stays out — a captured article's images are https or they
# do not load.
#
# Everything else stays closed: no bare scheme on `script-src`, `connect-src`,
# `font-src` or `frame-src`.
#
# `style-src` still allows inline styles: the UI library writes them, and the
# alternative is a nonce through a static file server that has no request
# context. Recorded rather than claimed as done.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Denies the device APIs the app does not use. `microphone=(self)` is the
# exception and is load-bearing: voice capture on the Capture page calls
# `getUserMedia({ audio: true })`, and denying it fails only in production —
# dev serves no headers at all — which is the same split the theme script was
# moved out of `index.html` to close.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
