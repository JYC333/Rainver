# nginx config for the production frontend image (Dockerfile `prod` stage).
# Serves the Vite-built SPA + PWA assets and proxies the API to the
# server container by its Compose service name.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API → server container (the TypeScript backend). depends_on in
    # compose guarantees the `server` service is started before nginx, so
    # the name resolves at config load.
    location /api/ {
        proxy_pass http://server:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Some operations (quota PTY refresh, workspace console runs) take 20-30 s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The paired-host daemon's only inbound-to-server channel: an outbound
    # WebSocket from the host machine to this exact path, authenticated by the
    # host bearer token in its hello frame. Exact match on purpose — every
    # other /internal/* route is service-to-service, guarded by the internal
    # token, and stays unreachable through this public entrypoint. Without
    # this block the SPA fallback answers the upgrade with index.html and the
    # daemon logs "connection closed before hello was acknowledged (1006)".
    # Daemon heartbeats every 15 s keep the socket inside the read timeout.
    location = /internal/hosts/ws {
        proxy_pass http://server:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The service worker must never be cached, or clients get stuck on a stale
    # SW and never pick up new deploys.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # Hashed build assets are immutable — cache them aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell must always be revalidated: it names hashed asset files, so a
    # heuristically cached copy after a deploy points at assets that no longer
    # exist. The SPA fallback below lands here through an internal redirect.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — let React Router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
