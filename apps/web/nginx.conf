# nginx config for the production frontend image (Dockerfile `prod` stage).
# Serves the Vite-built SPA + PWA assets and proxies the API to the
# server container by its Compose service name.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Browser security headers. nginx replaces (does not inherit) add_header
    # from this server block in any location that also uses add_header, so
    # those locations include the same file rather than repeating the set.
    include /etc/nginx/security-headers.conf;

    # The image's nginx.conf leaves gzip off, so the boot JavaScript and CSS
    # (and the service worker's precache of them) went out uncompressed. Static
    # text only: woff2 and PNG are already compressed, and /api/ turns it off
    # so authenticated responses that reflect request input are never
    # compressed (BREACH). HTML is compressed whenever gzip is on.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # API → server container (the TypeScript backend). depends_on in
    # compose guarantees the `server` service is started before nginx, so
    # the name resolves at config load.
    location /api/ {
        # The paired-host daemon posts Run diffs and output files here; nginx's
        # 1m default rejected them with an HTML 413 before the server's own
        # body limits could apply. Activity accepts up to 25 MiB of audio,
        # which needs extra space for base64 and the request envelope.
        client_max_body_size 36m;
        gzip off;
        proxy_pass http://server:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Some operations (quota PTY refresh, workspace console runs) take 20-30 s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The paired-host daemon's only inbound-to-server channel: an outbound
    # WebSocket from the host machine to this exact path, authenticated by the
    # host bearer token on the upgrade (`Authorization: Bearer`). Exact match
    # on purpose — every other /internal/* route is service-to-service, guarded
    # by the internal token, and stays unreachable through this public
    # entrypoint. Without this block the SPA fallback answers the upgrade with
    # index.html and the daemon logs "connection closed before hello was
    # acknowledged (1006)". Daemon heartbeats every 15 s keep the socket
    # inside the read timeout.
    location = /internal/hosts/ws {
        gzip off;
        proxy_pass http://server:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The service worker must never be cached, or clients get stuck on a stale
    # SW and never pick up new deploys.
    location = /version.json {
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        include /etc/nginx/security-headers.conf;
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        types { } default_type application/manifest+json;
    }

    # Hashed build assets are immutable — cache them aggressively. A tab still
    # running the previous build can ask for a lazy chunk this build does not
    # have; docker/retain-previous-assets.sh points this container's
    # /run/rainver-web/previous at that one build's files in the asset volume
    # before nginx starts. Anything else is still a plain 404, never the SPA shell.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri @previous_build_assets;
    }

    location @previous_build_assets {
        root /run/rainver-web/previous;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # The shell must always be revalidated: it names hashed asset files, so a
    # heuristically cached copy after a deploy points at assets that no longer
    # exist. The SPA fallback below lands here through an internal redirect.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # SPA fallback — let React Router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
